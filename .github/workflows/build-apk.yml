name: Compilar Vice City ROG APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar arquivos do repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Configurar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Instalar Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Montar estrutura Android a partir dos arquivos enviados
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/java/com/vicecityrog/wallpaper
          mkdir -p app/src/main/res/drawable-nodpi
          mkdir -p app/src/main/res/raw
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/xml

          # Os arquivos foram enviados pela interface web na raiz do repositorio.
          cp MainActivity.java app/src/main/java/com/vicecityrog/wallpaper/
          cp ViceCityWallpaperService.java app/src/main/java/com/vicecityrog/wallpaper/
          cp AndroidManifest.xml app/src/main/AndroidManifest.xml
          cp home.jpg app/src/main/res/drawable-nodpi/home.jpg
          cp preview.jpg app/src/main/res/drawable-nodpi/preview.jpg
          cp vice_city_lock.mp4 app/src/main/res/raw/vice_city_lock.mp4
          cp strings.xml app/src/main/res/values/strings.xml
          cp vice_city_wallpaper.xml app/src/main/res/xml/vice_city_wallpaper.xml

          # build.gradle (atual) e do app; build (1).gradle e do projeto raiz.
          cp build.gradle app/build.gradle
          cp 'build (1).gradle' build.gradle

      - name: Compilar APK
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: ViceCityROG-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
