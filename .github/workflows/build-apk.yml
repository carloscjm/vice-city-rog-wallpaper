name: Compilar icon pack Vice City - Rosa Neon
on:
  push:
    branches: [main]
    paths:
      - 'ViceCityIconPackProject.zip'
      - '.github/workflows/build-icon-pack.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@v4
      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: SDK Android 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - name: Descompactar projeto icon pack
        run: |
          test -f ViceCityIconPackProject.zip
          unzip -q -o ViceCityIconPackProject.zip -d .
          test -f ViceCityIconPackNeonProject/app/build.gradle
      - name: Compilar Icon Pack
        run: gradle -p ViceCityIconPackNeonProject --no-daemon :app:assembleDebug --stacktrace
      - name: Disponibilizar Icon Pack APK
        uses: actions/upload-artifact@v4
        with:
          name: ViceCity-Rosa-Neon-APK
          path: ViceCityIconPackNeonProject/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
